<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- displays site properly based on user's device -->

        <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />

        <!-- Reset CSS -->
        <link rel="stylesheet" href="./assets/css/reset.css" />

        <!-- Styles CSS -->
        <link rel="stylesheet" href="./assets/css/styles.css" />

        <title>Frontend Mentor | Blog preview card</title>
    </head>
    <body>
        <main>
            <div class="container">
                <a href="#">
                    <article class="blog-card">
                        <div class="blog-card__thumb">
                            <img class="blog-card__img" src="./assets/images/illustration-article.svg" alt="HTML & CSS foundations" />
                        </div>
                        <div class="blog-card__content">
                            <label class="blog-card__category text-3-bold">Learning</label>
                            <span class="blog-card__date text-3">Published 21 Dec 2023</span>
                            <h1 class="blog-card__heading text-1">HTML & CSS foundations</h1>
                            <p class="blog-card__info text-2">These languages are the backbone of every website, defining structure, content, and presentation.</p>
                        </div>
                        <div class="blog-card__author-info">
                            <img class="blog-card__author-avt" src="./assets/images/image-avatar.webp" alt="Greg Hooper" />
                            <span class="text-3-bold">Greg Hooper</span>
                        </div>
                    </article>
                </a>
            </div>
        </main>

        <footer class="attribution">Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. Coded by <a href="#">Tuan Khoi</a>.</footer>
    </body>
</html>
